[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "colony-agents"
version = "0.1.0"
description = "Evidence-checked shared state and loop detection for coding agents that share one repo."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.scripts]
colony = "colony.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
colony = ["prepare-commit-msg"]
